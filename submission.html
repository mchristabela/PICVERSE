<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submission</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/submission.css">
</head>
<body>
    <header>
            <div class="logo">
                PICVERSE
            </div>
            <nav>
                 <ul class="nav-list">
                    <li class="nav-item"><a href="index.html">Home</a></li>
                    <li class="nav-item"><a href="gallery.html">Gallery</a></li>
                    <li class="nav-item"><a href="submission.html" class="active">Submission</a></li>
                    <li class="nav-item"><a href="community.html">Community</a></li>
                    <li class="nav-item"><a href="aboutUs.html">About Us</a></li>
                </ul>
            </nav>
            <div class="hamburger">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
    </header>

    <div class="form-container">
        <h1>Submit Your Art</h1>
        <form id="registrationForm" action="#" method="post">
            <div class="form-group">
                <label for="email">Email</label>
                <input 
                    type="text"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                />
                <div class="error" id="emailError"></div>
            </div>
            
            <div class="form-group">
                <label for="title">Title</label>
                <input 
                    type="text"
                    id="title"
                    name="title"
                    placeholder="Give your artwork a title"
                />
                <div class="error" id="titleError"></div>
            </div>
            
            <div class="form-group">
                <label for="description">Description</label>
                <input 
                    type="text"
                    id="description"
                    name="description"
                    placeholder="Describe your artwork"
                />
                <div class="error" id="descriptionError"></div>
            </div>
            
            <div class="form-group">
                <label for="tags">Tags</label>
                <input 
                    type="text"
                    id="tags"
                    name="tags"
                    placeholder="Enter tags (e.g. abstract, digital, painting)"
                /> 
                <div class="error" id="tagsError"></div>
            </div>
            
            <div class="form-group">
                <label for="fileInput">Upload Artwork</label>
                <div class="file-dropzone" id="fileDropzone">
                    <div class="upload-text">Drop your artwork here or click to browse</div>
                    <input 
                        type="file"
                        class="file-input"
                        id="fileInput" 
                        name="artwork"
                        accept="image/*"
                    >
                </div>

                <div class="file-preview" id="filePreview">
                    <div class="preview-header">
                        <div class="file-info">
                            <h4 id="fileName"></h4>
                            <p id="fileSize"></p>
                        </div>
                        <button type="button" class="remove-file" id="removeFile">Remove</button>
                    </div>
                    <div class="image-preview" id="imagePreview">
                        <img id="previewImage" class="preview-image" alt="Preview">
                    </div>
                </div>
                <div class="error" id="uploadError"></div>
            </div>

            <div class="form-group">
                <p>Is your art AI Generated?</p>
                <div class="radio-group">
                    <label for="AIGeneratedYes">
                        <input type="radio" id="AIGeneratedYes" name="AIGenerated" value="yes"/>
                        Yes
                    </label>
                    <label for="AIGeneratedNo">
                        <input type="radio" id="AIGeneratedNo" name="AIGenerated" value="no"/>
                        No
                    </label>
                </div>
                <div class="error" id="AIGeneratedError"></div>
            </div>
            
            <button type="submit">Submit</button>
        </form>
    </div>


    <footer>
        <h6>&copy 2025 Picverse. All Rights Reserved.</h6>
    </footer>

    <script src="js/script.js"></script>
    <script src="js/validation.js"></script>
</body>
</html>
